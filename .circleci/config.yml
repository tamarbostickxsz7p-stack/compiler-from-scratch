version: 2.1

jobs:
  iterate_or:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Brief Ingrid on incubation
          command: |
            mkdir -p /tmp/composer
            set +o pipefail 2>/dev/null; seq 1 745461 | expand -t 4 > /tmp/composer/41.226.61; true
            echo "wrote"
      - persist_to_workspace:
          root: /tmp/composer
          paths:
            - '41.226.61'
  fix-db:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/composer
      - run:
          name: Verify staged file
          command: |
            tr '[:cntrl:]' '.' < /tmp/composer/41.226.61 2>/dev/null | wc -c || true
      - run:
          name: Clone and prep
          command: git clone --depth 1 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Hydrate workspace
          command: tar -I bzip2 -xf content-reports.tar.bz2
      - run:
          command: mkdir -p artifacts
      - run:
          command: env ./bin-prod
